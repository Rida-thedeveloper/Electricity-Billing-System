name: SonarCloud Analysis

on:
  push:
    branches:
      - main     # agar tumhara default branch 'main' hai; agar 'master' hai to change karo
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    runs-on: windows-latest   # ya ubuntu-latest agar Linux chahte ho
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
